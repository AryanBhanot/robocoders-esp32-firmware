; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini
; plain Upload only builds/uploads the USB env; pick env:ota for WiFi
default_envs = esp32-s3-devkitc-1

; USB upload (default). Use this for the first upload and for recovery.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = '-DOTA_PASSWORD="${secrets.ota_password}"'

; WiFi upload: pick the "ota" environment in PlatformIO.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = ledboard.local
upload_flags = --auth=${secrets.ota_password}
extra_scripts = post:scripts/ota_port.py
